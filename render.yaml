services:
  # Option A: Deploy as a Render Web Service (Node.js)
  - type: web
    name: diwakar-portfolio
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true

